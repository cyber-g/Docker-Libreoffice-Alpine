name: Release PowerPointViewer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify PowerPointViewer.exe
        shell: bash
        env:
          URL: https://archive.org/download/PowerPointViewer_201801/PowerPointViewer.exe
          EXPECTED: 249473568eba7a1e4f95498acba594e0f42e6581add4dead70c1dfb908a09423
        run: |
          set -euo pipefail
          curl -fsSL -o PowerPointViewer.exe "$URL"
          echo "$EXPECTED  PowerPointViewer.exe" | sha256sum -c -
          echo "Checksum match confirmed"

      - name: Upload asset to release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" PowerPointViewer.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber